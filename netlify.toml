[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Local dev with serverless functions: `npm run dev:netlify` → http://localhost:8888
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[functions]
  directory = "netlify/functions"
